<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tabela</title>
</head>
<body>
    <h2>Tabela de Disciplinas</h2>
    <!-- tabela com colspan -->
     <table width="100%" border="1" >
        <tr>
            <td>Aluno</td>
            <td colspan="2">Disciplinas</td>
        </tr>
        <tr>
            <td>Adones</td>
            <td>HTML</td>
            <td>Ambiente WEB</td>
        </tr>
     </table>

     <h2>Tabela de Disciplinas</h2>
    <!-- tabela com rowspan -->
     <table width="100%" border="1" >
        <tr>
            <td>Aluno</td>
            <td rowspan="2">Disciplinas</td>
        </tr>
        <tr>
            <td>Adones</td>
            <td>HTML</td>
            <td>Ambiente WEB</td>
        </tr>
     </table>
</body>
</html>
