<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ajax</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="container">
    <h1>API de Teste httpbin</h1>
    <form class="form m-2">
        <label class="form-label">Nome</label>
        <input class="form-control" type="text" id="n1"/>
        <a class="btn btn-primary m-2" href="#" onclick="executar()">Executar</a>
    </form>
    <div class="alert alert-warning" id="retorno"></div>
    <script src="exe.js"></script>
    <script>
        const executar = ()=> {
            const nome = document.getElementById('n1').value;
            ajax(nome,'retorno');
        }
    </script>
</body>


</html>
