<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h1 class="mb-4">Calculadora</h1>

    <form class="mb-3">
        <div class="mb-3">
            <label for="v1" class="form-label">Valor A</label>
            <input type="number" id="v1" class="form-control"/>
        </div>

        <div class="mb-3">
            <label for="v2" class="form-label">Valor B</label>
            <input type="number" id="v2" class="form-control"/>
        </div>

        <div class="mb-3">
            <label for="oper" class="form-label">Operação</label>
            <select id="oper" class="form-select">
                <option>Soma</option>
                <option>Subtração</option>
                <option>Multiplicação</option>
                <option>Divisão</option>
                <option>Potência</option>
            </select>
        </div>

        <a href="#" onclick="executar()" class="btn btn-primary">Executar</a>
    </form>

    <div id="resp" class="alert alert-info">O resultado aparece aqui</div>

    <!-- Script externo -->
    <script src="calculadora.js"></script>

    <script>
        const executar = () => {
            const a = Number(document.getElementById("v1").value);
            const b = Number(document.getElementById("v2").value);
            const oper = document.getElementById("oper").selectedIndex;

            let resultado = (oper == 0) ? somar(a, b) :
                            (oper == 1) ? subtrair(a, b) :
                            (oper == 2) ? multiplicar(a, b) :
                            (oper == 3) ? dividir(a, b) :
                                          exponencial(a, b);

            document.getElementById("resp").innerHTML = `O resultado da operação é <strong>${resultado}</strong>`;
        }
    </script>

    <!-- Script JS do Bootstrap (opcional, para componentes dinâmicos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
