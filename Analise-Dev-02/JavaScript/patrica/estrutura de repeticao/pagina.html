<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Serie Fibonacci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container">
    <h1>Série de Fibonacci</h1>
    <form class="form m-2">
        <label class="form-label">Valor de X</label>
        <input class="form-control" type="number" id="v1" />

        <a href="#" class="btn btn-primary m-2" onclick="executar()">Executar</a>
    </form>
    <div class="alert alert-success" id="resp">O resultado aparece aqui</div>

    <script src="for.js"></script>
    
    <script>
        const executar = () =>{
            const x = eval(document.getElementById("v1").value);
            let serie = "", i = 0;
            while(i<x){
                serie += fibonacci(i) + " "; 
                i++;
            }
            document.getElementById('resp').innerHTML = `O resultado ${serie}`;
        }
    </script>
</body>
</html>
