<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vetor</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="container">
    <h1>Google Charts</h1>
    <form class="form m-2">
        <label form="form-label">Valores de X</label>
        <input form="form-control" type="number" id="v1">
        <a class="btn btn-primary m-2" href="#" onclick="executar()">Executar</a>
    </form>

    <div id="chart_div"></div>
    <div id="media"></div>
    <div class="alert alert-warning" id="resp"></div>

    <script src="vetor.js"></script>

    <script>
        const executar = () =>{
            const  x = eval(document.getElementById('v1').value);
            addValor(x);
            google.charts.load('current', {packages: ['corechart']});
            google.charts.setOnLoadCallback(drawBasic);
            document.getElementById('media').innerHTML = `Media: ${media()}`;
        }
    </script>

</body>
</html>
